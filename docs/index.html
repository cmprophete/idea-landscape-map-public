  .demo-note { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; justify-content: space-between; padding: 12px 18px; border-bottom: 1px solid var(--strong); background: var(--panel); font-size: 15px; }

<body>
<header class="site-header">
  <a class="brand" href="https://github.com/cmprophete/idea-landscape-map-public">Beyond the Hot Take<span class="brand-tag">an idea landscape map</span></a>
  <nav class="site-nav" aria-label="Main">
    <a href="https://github.com/cmprophete/idea-landscape-map-public">Get the code</a>
    <a href="#method">Method</a>
  </nav>
</header>
<p class="demo-note"><strong>Demo</strong><span>This page shows one map made with the tool. To make your own, set up your own copy with the steps on <a href="https://github.com/cmprophete/idea-landscape-map-public#setup">GitHub</a>.</span></p>
<div id="root"><p class="loading muted">Loading the map…</p></div>
<footer class="site-footer">
  <div class="fine"><p class="credit">Icons by <a href="https://www.streamlinehq.com">Streamline</a>, <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.</p><p class="disc">Beyond the Hot Take: an idea landscape map. Built with Claude.</p></div>
</footer>
<script src="map.js"></script>
<script>
// The demo draws one saved map from demo-map.json. It never calls the server,
// so it costs nothing to host and can't start new research.
(async () => {
  const root = document.getElementById("root");
  try {
    const r = await fetch("demo-map.json", { cache: "no-cache" });
    if (!r.ok) throw new Error();
    const data = await r.json();
    document.title = (data.title || "Map") + " · Beyond the Hot Take demo";
    LandscapeMap.render(data, root, null);
  } catch {
    root.innerHTML = '<main class="lost"><span class="eyebrow">Demo</span><h1>The sample map isn\'t here yet.</h1><p class="note">Check back soon, or set up your own copy from the code on GitHub.</p></main>';
  }
})();
</script>
</body>
